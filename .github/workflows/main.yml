name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install dependencies
        run: npm ci

      - name: Build WASM module
        working-directory: findpath_wasm
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Generate Worker types
        run: npx wrangler types --cwd worker

      - name: Build the app
        run: npm run build

      - name: Upload Cloudflare build
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build
          path: |
            dist/carto_mh/index.mjs
            dist/carto_mh/wrangler.json
            dist/client/**
            dist/client/.assetsignore
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Download Cloudflare build
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-build
          path: dist/

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/carto_mh/wrangler.json
